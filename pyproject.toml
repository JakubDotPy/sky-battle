[project]
name = "skybattle"
version = "0.1.0"
description = "A top-down 2D plane-wars arena for bot programmers"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
sky-battle = "skybattle.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=8",
    "ruff>=0.16.6,<0.17",  # pinned to the ruff-pre-commit rev; bump both together
    "zensical>=0.0.60",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skybattle"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes, the baseline
    "I",             # import sorting
    "UP",            # pyupgrade: this is a 3.13+ package, say so
    "B",             # bugbear
    "S",             # bandit
    "BLE",           # blind-except
    "SIM",           # simplify
    "C4",            # comprehensions
    "RET",           # return
    "PTH",           # prefer pathlib
    "PIE", "PERF",   # misc lints and perf
    "RUF",           # ruff's own, incl. RUF100 for noqa that stopped applying
]
ignore = [
    "S311",   # the arena RNG seeds a game, it is not a cryptographic one
    "S603",   # running an author's bot as a subprocess is the product, not a lapse
    "COM812", # both conflict with the formatter
    "ISC001",
]

[tool.ruff.lint.per-file-ignores]
# A bot declares SQUADRON above its imports because the engine reads it by AST,
# without importing the module. That ordering is the contract, not an accident.
"samples/**" = ["E402"]
"games/**" = ["E402"]
"tests/**" = ["S101", "S310"]  # asserting is the job; the URL opened is the test's own server

[tool.pytest.ini_options]
testpaths = ["tests"]
