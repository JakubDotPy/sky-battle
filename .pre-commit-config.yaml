---
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-toml  # every game is a game.toml, so a typo should fail here
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Kept in step with the ruff in uv.lock. If the two drift, the hook and a
    # local `ruff format` disagree about the same file and the gate flaps.
    rev: v0.16.6
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [--fix]
      # Run the formatter.
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.3
    hooks:
      # lock dependencies
      - id: uv-lock

  # Format Markdown files.
  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.2.75
    hooks:
      - id: rumdl-fmt  # Auto-format
