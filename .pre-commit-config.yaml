---
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-toml  # every game is a game.toml, so a typo should fail here
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Held to the ruff in uv.lock, which pyproject constrains to the same minor.
    # If the two drift, the hook and a local `uv run ruff format` disagree about
    # the same file and the gate flaps, so `autoupdate` here needs a matching
    # `uv lock --upgrade-package ruff`.
    rev: v0.16.6
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [--fix]
      # Run the formatter.
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.3
    hooks:
      # lock dependencies
      - id: uv-lock

  # Format Markdown files.
  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.2.75
    hooks:
      # Not pinned to the rumdl on PATH: it is a user-level `uv tool install`,
      # not a project dependency, so the repo has nothing to pin it against.
      - id: rumdl-fmt  # Auto-format
