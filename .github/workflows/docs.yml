name: Documentation

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        # Zensical reads zensical.toml from the cwd only, and ours lives here.
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # Pinned exactly: setup-uv publishes no floating major tag past v8.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # uv walks up to the repo root for pyproject.toml and uv.lock, and fetches
      # the interpreter requires-python asks for. zensical is in the dev group.
      - run: uv run --frozen zensical build --clean

      - uses: actions/upload-pages-artifact@v5
        with:
          # site_dir is relative to docs-site/; this path is not.
          path: docs-site/site
      - uses: actions/deploy-pages@v5
        id: deployment
